<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>web shell client</title>
	<link rel="stylesheet" href="/public/build/src.css" />
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
		}

		:root {
			color-scheme: light dark;
		}

		body {
			padding: 10px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.25rem;
			background: #ffffff;
			color: #111827;
		}

		h1 {
			font-size: 1.5rem;
			font-weight: 600;
			text-align: center;
		}

		ul {
			list-style: none;
			display: flex;
			font-size: 1.4rem;
			flex-direction: column;
			gap: 0.75rem;
			padding: 0;
			align-items: center;
			text-align: center;
		}

		a {
			color: #2563eb;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		@media (prefers-color-scheme: dark) {
			body {
				background: #0a0a0a;
				color: #e5e7eb;
			}

			a {
				color: #60a5fa;
			}
		}
	</style>
</head>

<body>
	<h1>Choose ssh server</h1>
	<ul>
		{{range .}}
		<li>
			<a href="/ssh/{{.Name}}">{{.Name}}</a>
		</li>
		{{end}}
	</ul>
</body>

</html>
